[tool.poetry]
name = "epanetparser"
version = "0.1.0"
description = "A parser and toolkit for EPANET networks represented in WNTR JSON format"
authors = ["Paul Slavin <pmslavin@gmail.com>", "Tomasz Janus <tomasz.k.janus@gmail.com>"]

# Main package (networks folder is now inside epanetparser/)
packages = [
    { include = "epanetparser" }
]

# Force include extra networks even though gitignored
include = [
    { path = "epanetparser/networks/extra/**/*", format = ["sdist", "wheel"] }
]

# Optionally include documentation and tests in distribution
# include = [
#     "docs/**/*",
#     "tests/**/*"
# ]

[tool.poetry.dependencies]
python = "^3.10"
rich = "^12.2.0"
rich-argparse = "^1.5.2"
gdown = "^6.0.0"
wntr = "^1.4.0"
platformdirs = "^4.9.2"
# Parses the bundled default_config.yaml on import; not optional.
pyyaml = "^6.0"
# Imported directly by epanetparser.core.download.
requests = "^2.32"

[tool.poetry.scripts]
epanetparser = "epanetparser.core.parse:run"
epanetparser-plugins = "epanetparser.core.plugins_cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4"
pudb = "^2025.1"
coverage = "^7.6"
pyflakes = "^3.4"
mypy = "^1.13"
flake8 = "^7.1"
pytest-cov = "^5.0"
nox = "^2024.4.22"
sphinx = "^8.1"
sphinx-rtd-theme = "^3.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-config",
    "--strict-markers"
]
xfail_strict = true
testpaths = ["tests"]


[mypy]
python_version = "3.10"


[tool.setuptools.package-data]
epanetparser = [
    "config/*.yaml",
]


[tool.epanetparser]
# NOTE: this section is not read by the code. Rule set search paths come from
# `rule_set_discovery` in the configuration file (default_config.yaml), which is
# the single source of truth. In that file `packages` replaces this list and
# `extra_packages` appends to it; the built-in packages are always searched
# first. The lists below are kept for reference and are expected to go stale;
# see docs/TODO_MODEL_LAYER_DUPLICATION.md.
rules_dirs = [
    "epanetparser.core_rules",
    "epanetparser.custom_rules"
]

rulesets_dirs = [
    "epanetparser.core_rules.epanet_core"
]
